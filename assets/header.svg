<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 152" role="img" aria-labelledby="title desc">
<title id="title">Data, software and systems</title>
<desc id="desc">Animated panels show Olist review averages, a course-library application and a small-model performance scatterplot. Motion can be disabled in accessibility settings.</desc>
<style>
.panel{fill:#161b22;stroke:#30363d;stroke-width:1}
.label{fill:#8b949e;font:600 10px Arial,sans-serif;letter-spacing:.8px}
.sub{fill:#c9d1d9;font:10px Arial,sans-serif}
.small{fill:#8b949e;font:9px Arial,sans-serif}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:grow 6s ease-in-out infinite}
.late{animation-delay:.18s}
.window{animation:fade 6s ease-in-out infinite}
.point{animation:pop 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.p2{animation-delay:.15s}.p3{animation-delay:.3s}.p4{animation-delay:.45s}.p5{animation-delay:.6s}
@keyframes grow{0%,7%{transform:scaleY(.08);opacity:.4}27%,85%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.08);opacity:.4}}
@keyframes fade{0%,15%{opacity:.35}38%,88%{opacity:1}100%{opacity:.35}}
@keyframes pop{0%,32%{opacity:.25;transform:scale(.5)}56%,90%{opacity:1;transform:scale(1)}100%{opacity:.25;transform:scale(.5)}}
@media(prefers-reduced-motion:reduce){.bar,.window,.point{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect x="1" y="1" width="210" height="138" rx="8" class="panel"/>
<rect x="225" y="1" width="210" height="138" rx="8" class="panel"/>
<rect x="449" y="1" width="210" height="138" rx="8" class="panel"/>
<text x="15" y="21" class="label">01 / DATA</text>
<text x="239" y="21" class="label">02 / SOFTWARE</text>
<text x="463" y="21" class="label">03 / SYSTEMS</text>
<text x="15" y="39" class="sub">Olist review averages</text>
<text x="239" y="39" class="sub">Course library</text>
<text x="463" y="39" class="sub">Inference benchmarks</text>
<path d="M20 113H193" stroke="#484f58"/>
<rect class="bar" x="44" y="66" width="42" height="47" rx="3" fill="#3fb950"/>
<rect class="bar late" x="125" y="89" width="42" height="24" rx="3" fill="#58a6ff"/>
<text x="65" y="60" class="sub" text-anchor="middle">4.29</text>
<text x="146" y="83" class="sub" text-anchor="middle">2.27</text>
<text x="65" y="128" class="small" text-anchor="middle">On-time</text>
<text x="146" y="128" class="small" text-anchor="middle">Late</text>
<g class="window">
<rect x="239" y="52" width="182" height="75" rx="5" fill="#0d1117" stroke="#484f58"/>
<path d="M239 68H421" stroke="#484f58"/>
<circle cx="250" cy="60" r="2.5" fill="#f85149"/>
<circle cx="260" cy="60" r="2.5" fill="#d29922"/>
<circle cx="270" cy="60" r="2.5" fill="#3fb950"/>
<rect x="250" y="79" width="52" height="36" rx="3" fill="#21262d"/>
<path d="M257 87H295M257 96H285M257 105H291" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
<path d="M314 83H403M314 96H382M314 109H395" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
</g>
<path d="M467 56V113H640" stroke="#484f58" fill="none"/>
<path d="M467 84H640" stroke="#30363d" stroke-dasharray="3 5"/>
<g fill="#58a6ff">
<circle class="point" cx="485" cy="67" r="4"/>
<circle class="point p2" cx="507" cy="82" r="4"/>
<circle class="point p3" cx="535" cy="92" r="4"/>
<circle class="point p4" cx="570" cy="99" r="4"/>
<circle class="point p5" cx="616" cy="106" r="4"/>
</g>
<text x="470" y="128" class="small">VRAM →</text>
<text x="638" y="128" class="small" text-anchor="end">Higher throughput ↑</text>
</svg>