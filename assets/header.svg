    <g transform="translate(26.5,40)">
      <rect x="-4.5" y="-22" width="9" height="22" fill="#2da44e" opacity="0">
        <animateTransform attributeName="transform" type="scale" additive="sum" values="0 1;1 1;1 1;0 0" keyTimes="0;0.1;0.82;1" dur="6s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.88;1" dur="6s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(40.5,40)">
