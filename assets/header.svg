<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img">
  <!-- Card 01 DATA: the real Olist satisfaction chart from ds-portfolio (5.24 on-time, 2.71 late, 1.87, 1.72, 1.25) -->
  <g>
